name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Each entry compiles a distinct optional-feature path.
  build-test:
    name: build + doctest (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: defaults
            options: ""
          - name: everything-off
            options: -e TLS=OFF -e GLAZE=OFF -e ZLIB=OFF -e EXPERIMENTAL=OFF
          - name: tls-only
            options: -e TLS=ON -e GLAZE=OFF -e ZLIB=OFF
          - name: glaze-only
            options: -e TLS=OFF -e GLAZE=ON -e ZLIB=OFF
          - name: everything-on
            options: -e TLS=ON -e GLAZE=ON -e ZLIB=ON
          - name: reflection
            options: --entrypoint /usr/local/bin/reflection-build.sh
          - name: release
            options: -e BUILD_TYPE=Release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Toolchain image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./docker
          tags: erikslund-http-build:latest
          load: true
          cache-from: type=gha,scope=toolchain
          cache-to: type=gha,mode=max,scope=toolchain

      - name: Build and test
        run: |
          docker run --rm \
            -v "$PWD:/src:ro" \
            -v erikslund-http-build:/build \
            -e RUN_TESTS=1 \
            ${{ matrix.options }} \
            erikslund-http-build

  clang-tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Toolchain image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./docker
          tags: erikslund-http-build:latest
          load: true
          cache-from: type=gha,scope=toolchain
          cache-to: type=gha,mode=max,scope=toolchain
      - name: clang-tidy
        run: |
          docker run --rm \
            -v "$PWD:/src:ro" \
            -v erikslund-http-lint:/build \
            --entrypoint /usr/local/bin/clang-tidy.sh \
            erikslund-http-build

  cppcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Toolchain image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./docker
          tags: erikslund-http-build:latest
          load: true
          cache-from: type=gha,scope=toolchain
          cache-to: type=gha,mode=max,scope=toolchain
      - name: cppcheck
        run: |
          docker run --rm \
            -v "$PWD:/src:ro" \
            -v erikslund-http-lint:/build \
            --entrypoint /usr/local/bin/cppcheck.sh \
            erikslund-http-build

  # Verify propagated usage requirements through every documented integration path.
  consumer:
    name: consumer integration paths (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: defaults
            options: ""
          - name: everything-off
            options: -e TLS=OFF -e GLAZE=OFF -e ZLIB=OFF -e EXPERIMENTAL=OFF
          - name: everything-on
            options: -e TLS=ON -e GLAZE=ON -e ZLIB=ON
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Toolchain image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./docker
          tags: erikslund-http-build:latest
          load: true
          cache-from: type=gha,scope=toolchain
          cache-to: type=gha,mode=max,scope=toolchain
      - name: add_subdirectory, FetchContent, and install + find_package
        run: |
          docker run --rm \
            -v "$PWD:/src:ro" \
            -v erikslund-http-consumer-${{ matrix.name }}:/build \
            ${{ matrix.options }} \
            --entrypoint /bin/bash \
            erikslund-http-build /src/.github/consumer-smoke.sh

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Toolchain image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./docker
          tags: erikslund-http-build:security-scan
          load: true
          cache-from: type=gha,scope=toolchain
          cache-to: type=gha,mode=max,scope=toolchain
      - name: Software bill of materials
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: erikslund-http-build:security-scan
          artifact-name: erikslund-http-toolchain.spdx.json
          format: spdx-json
          upload-release-assets: false
      - name: Fixed high-severity vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          image: erikslund-http-build:security-scan
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table

  # A skipped or cancelled dependency must fail the required check.
  required:
    name: required
    if: always()
    needs: [build-test, clang-tidy, cppcheck, consumer, supply-chain]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every gate must have succeeded
        run: |
          set -euo pipefail
          results="${{ join(needs.*.result, ' ') }}"
          echo "gate results: $results"
          for result in $results; do
              if [ "$result" != "success" ]; then
                  echo "a required gate reported '$result'"
                  exit 1
              fi
          done
          echo "every gate succeeded"
